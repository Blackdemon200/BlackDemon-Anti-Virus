# BlackDemon AV Windows real-time user-mode service - the companion to the
# BlackDemon AV.sys minifilter. Windows-only; intentionally OUTSIDE the root
# workspace (its own [workspace]) so it never affects the Linux build.
[package]
name = "blackdemon-rtsvc"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "blackdemon-rtsvc"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_InstallableFileSystems",
] }
windows-service = "0.7"
blackdemon-core = { path = "../../../../crates/blackdemon-core" }
blackdemon-config = { path = "../../../../crates/blackdemon-config" }
blackdemon-common = { path = "../../../../crates/blackdemon-common" }


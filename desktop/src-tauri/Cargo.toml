# Standalone workspace so the engine workspace never pulls the GUI toolchain.
[workspace]

[package]
name = "blackdemon-desktop"
version = "2026.1.1"
edition = "2021"
authors = ["BlackDemon <https://github.com/Blackdemon200>"]
description = "BlackDemon AV cross-platform desktop application (Tauri v2)."
license = "Apache-2.0"

[lib]
name = "blackdemon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The real BlackDemon AV engine - the GUI is a thin shell over these crates.
blackdemon-core = { path = "../../crates/blackdemon-core" }
blackdemon-config = { path = "../../crates/blackdemon-config" }
blackdemon-signatures = { path = "../../crates/blackdemon-signatures" }
blackdemon-common = { path = "../../crates/blackdemon-common" }
blackdemon-intel = { path = "../../crates/blackdemon-intel" }
blackdemon-realtime = { path = "../../crates/blackdemon-realtime" }
blackdemon-firewall = { path = "../../crates/blackdemon-firewall" }
blackdemon-quarantine = { path = "../../crates/blackdemon-quarantine" }
blackdemon-unpack = { path = "../../crates/blackdemon-unpack" }
blackdemon-sandbox = { path = "../../crates/blackdemon-sandbox" }
blackdemon-behavior = { path = "../../crates/blackdemon-behavior" }
blackdemon-anomaly = { path = "../../crates/blackdemon-anomaly" }

# Real system metrics + in-app threat-intel downloads.
sysinfo = "0.33"
ureq = "2"
# Per-device identity for the authenticated feed channel.
getrandom = "0.2"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true


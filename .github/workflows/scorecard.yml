name: scorecard
# OpenSSF Scorecard - automated supply-chain security scoring.
# Disabled: the scorecard-action pulls from gcr.io which requires
# Google Cloud billing. Re-enable by uncommenting 'on:' below once
# you have GCP billing set up, or remove this file entirely.
on:
  workflow_dispatch: # manual only - disabled automatic triggers

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Skip unless manually triggered
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
